[project]
name = "drf-homework-on-line-platform"
version = "0.1.0"
description = ""
authors = [
    {name = "Olesia Laskovets",email = "olesya_izvarina@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "stripe (>=15.3.1,<16.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "gunicorn (>=26.1.0,<27.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage (>=7.15.2,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = [
    "test_*.py",
    "*_tests.py",
]

[tool.black]
line-length = 88
target-version = ["py313"]
exclude = '''
/(
    \.venv
    | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [
    ".venv",
    "migrations",
]

[tool.flake8]
max-line-length = 88
exclude = [
    ".venv",
    "migrations",
    "__pycache__",
    ".git",
]
